name: attach-guide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach user guide PDF to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          echo "Attaching to release: $TAG"
          gh release upload "$TAG" docs/MECHANICUS-User-Guide.pdf --clobber
