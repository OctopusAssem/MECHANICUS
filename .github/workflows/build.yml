name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Restore signing keystore
        env:
          MECHANICUS_KEYSTORE_B64: ${{ secrets.MECHANICUS_KEYSTORE_B64 }}
        run: |
          mkdir -p app/keystore
          echo "$MECHANICUS_KEYSTORE_B64" | base64 -d > app/keystore/mechanicus.p12

      - name: Build release APK
        env:
          MECHANICUS_SYNC_BLOB: ${{ secrets.MECHANICUS_SYNC_BLOB }}
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          { grep -E "^e: |error: |FAILURE: " build.log | head -60; echo '---- tail ----'; tail -30 build.log; } > last-errors.txt || true
          exit $rc

      - name: Commit build errors
        if: failure()
        run: |
          git config user.email "334589465+OctopusAssem@users.noreply.github.com"
          git config user.name "AssemHussein"
          git add last-errors.txt
          git commit -m "[skip ci] build errors" || exit 0
          git push

      - name: Show APK info
        run: |
          ls -l app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/release/*.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechanicus-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MECHANICUS build ${{ github.run_number }}
          body: |
            Automated build from main (${{ github.sha }}).
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
