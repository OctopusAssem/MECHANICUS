name: desktop

on:
  workflow_dispatch:
  push:
    branches: [ windows, main ]
    paths:
      - "desktop/**"
      - "shared/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Inject sync blob
        shell: bash
        run: |
          cat > desktop/src/main/kotlin/com/assem/mechanicus/desktop/DesktopConfig.kt <<EOF
          package com.assem.mechanicus.desktop

          const val SYNC_BLOB = "${{ secrets.MECHANICUS_SYNC_BLOB }}"
          EOF

      - name: Build Windows MSI
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :desktop:packageMsi --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect errors
        if: failure()
        shell: bash
        run: |
          {
            echo "=== e: / error: lines ==="
            grep -aE '^e: |^w: |error:|Unresolved reference|Type mismatch|Cannot access|No value passed|only safe|Overload resolution ambiguity|None of the following' build.log | head -120
            echo ""
            echo "=== context ==="
            grep -aE -B3 -A8 '^e: ' build.log | head -300
            echo ""
            echo "=== FAILURE ==="
            grep -aE 'What went wrong|FAILURE:|Caused by|Execution failed|BUILD FAILED' build.log | head -60
          } > desktop/last-build-errors.txt 2>&1 || true
          head -80 desktop/last-build-errors.txt

      - name: Commit errors
        if: failure()
        shell: bash
        run: |
          git config user.name "mechanicus-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f desktop/last-build-errors.txt
          git commit -m "ci: capture build errors [skip ci]" || true
          git push origin HEAD:windows || true

      - name: Show output
        if: success()
        run: dir desktop\build\compose\binaries\main\msi

      - name: Publish Windows release
        if: success() && github.ref == 'refs/heads/windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSI=$(ls desktop/build/compose/binaries/main/msi/*.msi)
          echo "MSI: $MSI"
          if ! gh release view desktop-1.0.4 >/dev/null 2>&1; then
            gh release create desktop-1.0.4 --target windows \
              --title "MECHANICUS for Windows 1.0.4" \
              --notes "Windows desktop edition of MECHANICUS (Compose Multiplatform). Offline-first, Arabic/English, silent Google Drive sync via the company key. Install the MSI, sign in with a name + 4-digit PIN, then enter the company key in Settings."
          fi
          gh release upload desktop-1.0.4 "$MSI" --clobber

      - name: Upload MSI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mechanicus-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
