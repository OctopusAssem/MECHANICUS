name: desktop

on:
  workflow_dispatch:
  push:
    branches: [ windows, main ]
    paths:
      - "desktop/**"
      - "shared/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Inject sync blob
        shell: bash
        run: |
          cat > desktop/src/main/kotlin/com/assem/mechanicus/desktop/DesktopConfig.kt <<EOF
          package com.assem.mechanicus.desktop

          const val SYNC_BLOB = "${{ secrets.MECHANICUS_SYNC_BLOB }}"
          EOF

      - name: Build Windows MSI
        run: gradle :desktop:packageMsi --no-daemon --stacktrace

      - name: Show output
        run: dir desktop\build\compose\binaries\main\msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechanicus-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
